# Nginx configuration for local same-origin testing
# This simulates CloudFront behavior by serving both frontend and backend on the same origin

events {
    worker_connections 1024;
}

http {
    # Basic MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging (Docker will capture these)
    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Increase buffer sizes to handle large cookie headers
    # Default is 1k for client_header_buffer_size and 4 8k for large_client_header_buffers
    # This is needed when cookies are very large (e.g., Supabase auth tokens, analytics cookies)
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    # Upstream servers
    upstream frontend {
        server localhost:3000;
    }

    upstream backend {
        server localhost:8000;
    }

    server {
        listen 3100;
        server_name localhost;

        # Increase client body size for file uploads
        client_max_body_size 100M;

        # Backend API routes - matches CloudFront /api/* behavior
        location /api/ {
            proxy_pass http://backend;
            
            # Forward necessary headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Important: Forward cookies to backend
            proxy_pass_request_headers on;
            
            # Important: Allow cookies to be set by backend
            proxy_pass_header Set-Cookie;
            
            # Disable buffering for streaming responses (SSE)
            proxy_buffering off;
            proxy_cache off;
            
            # HTTP/1.1 support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Handle chunked/streaming responses properly
            # Let nginx handle the response body correctly
            chunked_transfer_encoding on;
            
            # Timeouts for long-running requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Frontend routes - serve from Vite dev server
        location / {
            proxy_pass http://frontend;
            
            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward other headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

